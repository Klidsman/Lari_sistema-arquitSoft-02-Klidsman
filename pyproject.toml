[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgresql: requiere una base PostgreSQL real (sin SQLite)",
]

[tool.coverage.run]
source = ["tenants", "acceso", "auditoria"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
