{% comment %}
Marca de Lari. La clase externa controla color y tamaño.
Uso: {% include "parciales/marca.html" with marca_clase="marca-lari--shell" %}
{% endcomment %}
<span class="marca-lari {{ marca_clase|default:'' }}">
  <svg class="marca-lari__simbolo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <path d="M10 9v14h12" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 13h7M16 17h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </svg>
  <span class="marca-lari__texto">
    <span class="marca-lari__nombre">Lari</span>
    <span class="marca-lari__desc">Control de materiales</span>
  </span>
</span>
