<table class="tabla">
  <thead><tr><th>Material</th><th>Disponible</th><th>Cantidad usada</th></tr></thead>
  <tbody>
    {% for fila in filas %}
      <tr>
        <td>{{ fila.material.codigo }} - {{ fila.material.descripcion }}</td>
        <td>{{ fila.disponible }}</td>
        <td><input type="number" min="0" name="cantidades[{{ fila.material.pk }}]" value="{{ fila.cantidad }}"></td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No hay materiales habilitados.</td></tr>
    {% endfor %}
  </tbody>
</table>
