{% extends "base.html" %}

{% block title %}Iniciar sesión · Lari{% endblock %}

{% block contenido %}
  <h1>Iniciar sesión</h1>

  {% if error %}
    <p class="mensaje mensaje-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
