{% extends "base.html" %}

{% block title %}Mi perfil · Lari{% endblock %}

{% block contenido %}
  <h1>Mi perfil</h1>
  <p>Correo: {{ request.usuario.email }}</p>
  <p>Rol: {{ request.rol }}</p>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
  </form>
{% endblock %}
