<form method="post" action="{{ accion }}" class="formulario-totp">
  {% csrf_token %}
  <div class="campo-codigo">
    <label for="{{ form.codigo.id_for_label }}">{{ form.codigo.label }}</label>
    {{ form.codigo }}
    {% if form.codigo.errors %}
      <ul class="errorlist">
        {% for error in form.codigo.errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
  <button type="submit" class="boton-primario">{{ texto_boton }}</button>
</form>
